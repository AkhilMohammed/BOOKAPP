version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: sh -c "./entrypoint.sh"
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    networks:
      - backend
    ports:
      - "8000:8000"
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A bookonlinesales  worker --loglevel=info --concurrency=4
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
    networks:
      - backend
    environment:
      - DB_URL=postgresql://postgres:akhil@387@db:5432/postgres
      - DB_USER=postgres
      - DB_PASSWORD=akhil@387
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0

  db:
    image: postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: akhil@387
    ports:
      - "5432:5432"
    networks:
      - backend

  redis:
    image: redis
    ports:
      - "6379:6379"
    networks:
      - backend

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - backend

  nginx:
    image: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web
    networks:
      - backend

networks:
  backend:
    driver: bridge
